<!--
  E:\무역관리프로그램\app\index.html 의 <head> 안에 아래 내용을 추가하세요.
  기존 <title> 태그 바로 아래에 붙여넣으시면 됩니다.
-->

<!-- ── PWA / Apple 모바일 설정 ── -->

<!-- iOS 홈 화면 추가 시 앱처럼 실행 -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="YSACC" />

<!-- iOS 홈 화면 아이콘 -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192.png" />

<!-- Android / 공통 -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#C41E3A" />
<meta name="application-name" content="YSACC" />

<!-- 뷰포트 (이미 있으면 확인 후 중복 추가 X) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
